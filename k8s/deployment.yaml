apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-enhancer
  labels:
    app: metadata-enhancer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metadata-enhancer
  template:
    metadata:
      labels:
        app: metadata-enhancer
    spec:
      containers:
      - name: metadata-enhancer
        # Replace 'your-dockerhub-username' with your actual Docker Hub username
        # You can update this manually or via a sed command in your deployment script
        image: akshay1211/metadata-enhancer:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        env:
        # It's best practice to use Secrets for API keys, but for simplicity here:
        # You would typically use a SecretKeyRef
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: gemini-api-key
